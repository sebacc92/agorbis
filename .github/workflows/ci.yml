name: CI

permissions:
  contents: read

# Hasta ahora `pnpm lint` y las pruebas corrían sólo a mano, en la máquina de
# quien tocaba el código. Un pull request podía traer TypeScript roto, una key
# de i18n faltante o una prueba en rojo sin que nada lo dijera.
#
# Desde 2026-10-20 la CI se parte en tres niveles (contrato de scripts v11):
# - `verificar` e `integracion` son los checks requeridos para llegar a `main`:
#   lint rápido, tests de producto, tipos, build, audit high, base y e2e. No
#   dependen de bajar paquetes .deb puntuales por URL ni de digests exactos de
#   Node/pnpm/git, así que un parche de Ubuntu o de Node no los rompe.
# - `release-gates` corre `pnpm test.release` (políticas D72, Cloudflare,
#   preflight, backups, pins) con la toolchain auditada exacta. Un fallo ahí
#   bloquea un release, no una PR de producto.
# - `auditoria-semanal` corre `pnpm audit --audit-level=low` informativo y
#   falla si una excepción de `pnpm-workspace.yaml` pasó su fecha de revisión,
#   para que la corrida programada quede en rojo y avise (D77).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes 09:17 UTC (06:17 en Buenos Aires).
    - cron: "17 9 * * 1"

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido pagar por validar un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          standalone: true

      # `package.json` fija `packageManager`, así que la versión de pnpm sale
      # de ahí y no se declara dos veces. Ese mismo campo hace que setup-node
      # active su caché de pnpm por defecto; acá no hay nada que guardar (las
      # dependencias se instalan desde un store aislado y efímero) y el post-job
      # fallaba con "Path Validation Error" (corrida 55), así que se apaga.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Instalar dependencias desde un store aislado
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          test "$(node --version)" = "v22.22.0"
          test "$(pnpm --version)" = "11.15.0"
          test "$(pnpm config get sideEffectsCache)" = "false"
          agorbis_pnpm_scratch="$(mktemp -d "${RUNNER_TEMP:?}/agorbis-pnpm.XXXXXX")"
          agorbis_pnpm_store="${agorbis_pnpm_scratch}/store"
          test ! -e node_modules
          test ! -L node_modules
          test ! -e "$agorbis_pnpm_store"
          test ! -L "$agorbis_pnpm_store"
          pnpm install --frozen-lockfile --store-dir "$agorbis_pnpm_store"
          agorbis_effective_store="$(realpath "$(pnpm store path --store-dir "$agorbis_pnpm_store")")"
          agorbis_pnpm_store="$(realpath "$agorbis_pnpm_store")"
          case "$agorbis_effective_store" in
            "$agorbis_pnpm_store"|"$agorbis_pnpm_store"/*) ;;
            *) echo "El store efectivo de pnpm escapó del scratch aislado." >&2; exit 1 ;;
          esac

      # Objetivo < 2 min: eslint, prettier, secretos, keys, i18n, legal, la
      # fuente pública del build y las excepciones de audit anotadas.
      - run: pnpm lint

      # Vitest + tests de lógica pura del producto (i18n, IA, bidi, cívicos).
      - run: pnpm test

      # El CLI de Qwik también valida tipos, pero mantener el paso explícito
      # hace visible qué gate falló y cubre los E2E incluidos en tsconfig.
      - run: pnpm build.types

      - run: pnpm build
        env:
          # Valores de relleno: el build no habla con Supabase, pero Vite
          # inlinea las `PUBLIC_*` en el bundle del navegador y sin ellas el
          # cliente quedaría con `undefined` adentro. No son secretos ni
          # sirven para nada fuera de esta corrida.
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54821
          PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          PUBLIC_SITE_URL: https://agorbis.invalid
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      # Bloqueante desde `high`: los advisories dev-only revisados están en
      # `pnpm-workspace.yaml` con ruta, motivo y fecha de revisión. Va al final
      # para que un advisory nuevo no oculte el resultado de lint/test/build.
      - run: pnpm audit --audit-level=high

  integracion:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # La suite E2E completa en serie tarda 18,6 min en local y el runner es
    # ~1,5 veces más lento; con el arranque de Supabase (4 min) y un reintento
    # por fallo, 30 min cortaba la corrida sin terminar (run 40906527104).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          standalone: true

      # `package.json` fija `packageManager`, así que la versión de pnpm sale
      # de ahí y no se declara dos veces. Ese mismo campo hace que setup-node
      # active su caché de pnpm por defecto; acá no hay nada que guardar (las
      # dependencias se instalan desde un store aislado y efímero) y el post-job
      # fallaba con "Path Validation Error" (corrida 55), así que se apaga.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Instalar dependencias desde un store aislado
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          test "$(node --version)" = "v22.22.0"
          test "$(pnpm --version)" = "11.15.0"
          test "$(pnpm config get sideEffectsCache)" = "false"
          agorbis_pnpm_scratch="$(mktemp -d "${RUNNER_TEMP:?}/agorbis-pnpm.XXXXXX")"
          agorbis_pnpm_store="${agorbis_pnpm_scratch}/store"
          test ! -e node_modules
          test ! -L node_modules
          test ! -e "$agorbis_pnpm_store"
          test ! -L "$agorbis_pnpm_store"
          pnpm install --frozen-lockfile --store-dir "$agorbis_pnpm_store"
          agorbis_effective_store="$(realpath "$(pnpm store path --store-dir "$agorbis_pnpm_store")")"
          agorbis_pnpm_store="$(realpath "$agorbis_pnpm_store")"
          case "$agorbis_effective_store" in
            "$agorbis_pnpm_store"|"$agorbis_pnpm_store"/*) ;;
            *) echo "El store efectivo de pnpm escapó del scratch aislado." >&2; exit 1 ;;
          esac

      # El CLI no persiste sus pins en Git. Materializamos exclusivamente las
      # cinco versiones públicas auditadas antes de crear el stack efímero.
      - run: pnpm db.prepare-ci-pins

      # `supabase start` crea una instalación limpia y aplica todas las
      # migraciones + seed; después verificamos el esquema desde los roles API.
      - run: pnpm exec supabase start

      # `supabase start` puede devolver control cuando los servicios HTTP ya
      # responden pero Storage/Auth todavía están aplicando sus migraciones
      # administradas. Este gate acotado exige los historiales y firmas exactos
      # antes de generar el contrato TypeScript.
      - run: pnpm db.managed-ready

      - run: pnpm exec supabase db lint --local --level warning --fail-on warning

      # Una migración que cambia el contrato de PostgREST también debe traer
      # los tipos regenerados. El diff falla en CI si el archivo versionado
      # quedó atrasado respecto del esquema que acaba de arrancar.
      - run: pnpm db.types

      - run: git diff --exit-code -- src/lib/database.types.ts

      - run: pnpm db.test

      # D103: el catálogo fijado del auditor de Supabase, ejecutado contra este
      # PostgreSQL real, no puede truncar identidades de funciones. Crea dos
      # sobrecargas de prueba dentro de una transacción que siempre se revierte.
      - name: Catálogo D72 contra PostgreSQL local
        run: node scripts/test-d72-supabase-catalog-identity-local.mjs

      - run: pnpm exec playwright install --with-deps chromium

      # El webServer de Playwright corre `qwik build preview`, que a su vez
      # ejecuta `pnpm lint`: con el lint rápido ya no arrastra los gates D72.
      - run: pnpm test.e2e

      # Captura, traza, video y `error-context.md` de cada intento fallido.
      # Sin esto, de una prueba inestable sólo quedaba "no apareció en 5 s".
      # `always()` y no `failure()`: con `retries: 1` una inestable pasa en el
      # reintento y el job termina bien, que es justo cuando hace falta.
      # Playwright sólo conserva los intentos fallidos (`retain-on-failure`) y
      # `.last-run.json` es oculto: en una corrida limpia no se sube nada.
      # Son datos del seed y de Supabase local, nunca de Producción.
      - name: Guardar resultados de Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Detener Supabase local
        if: always()
        run: pnpm exec supabase stop --no-backup

  release-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # El inventario D72 no puede saltarse por falta de toolchain en este job.
      AGORBIS_REQUIRE_PINNED_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Instalar el lock de sistema verificado
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "amd64"
          agorbis_util_linux_deb="$(mktemp "${RUNNER_TEMP:?}/agorbis-util-linux.XXXXXX.deb")"
          curl --fail --silent --show-error --location --proto '=https' \
            'https://security.ubuntu.com/ubuntu/pool/main/u/util-linux/util-linux_2.39.3-9ubuntu6.6_amd64.deb' \
            --output "$agorbis_util_linux_deb"
          printf '%s  %s\n' '08eb17ba3b83378ed1e73d8335d0ce03b429c0bbeb07e374f536234edab02465' "$agorbis_util_linux_deb" | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$agorbis_util_linux_deb"
          test "$(dpkg-query -W -f='${Version}' util-linux)" = "2.39.3-9ubuntu6.6"
          printf '%s  %s\n' 'e619344dc3eec4023498465679262f9ca27d1e8cef9cfc4c1ae72b428577b806' '/usr/bin/flock' | sha256sum --check --strict

      - name: Instalar Git auditado para los gates de release
        shell: bash
        # 1:2.43.0-1ubuntu7.4 (16-10-2026, LP #2171054): el archivo de Ubuntu
        # retira el .deb anterior al publicar uno nuevo, así que el pin se
        # renueva con la cadena firmada del índice (ver el runbook, nota
        # 2026-10-29) y nunca a ojo.
        run: |
          set -euo pipefail
          agorbis_git_deb="$(mktemp "${RUNNER_TEMP:?}/agorbis-git.XXXXXX.deb")"
          agorbis_git_man_deb="$(mktemp "${RUNNER_TEMP:?}/agorbis-git-man.XXXXXX.deb")"
          curl --fail --silent --show-error --location --proto '=https' \
            'https://security.ubuntu.com/ubuntu/pool/main/g/git/git_2.43.0-1ubuntu7.4_amd64.deb' \
            --output "$agorbis_git_deb"
          curl --fail --silent --show-error --location --proto '=https' \
            'https://security.ubuntu.com/ubuntu/pool/main/g/git/git-man_2.43.0-1ubuntu7.4_all.deb' \
            --output "$agorbis_git_man_deb"
          printf '%s  %s\n' 'c79b7948ef9860c97ec74293a90178676e63368a0711c95c28a55af4edf1adab' "$agorbis_git_deb" | sha256sum --check --strict
          printf '%s  %s\n' '77f57651734edc24b5a9e7863bc261bf302060ac3c12bbb08a459966ea4d30a6' "$agorbis_git_man_deb" | sha256sum --check --strict
          # Sólo en el runner efímero: sustituir Git 2.55 por el paquete auditado.
          sudo apt-get install --yes --no-install-recommends --allow-downgrades "$agorbis_git_deb" "$agorbis_git_man_deb"
          test "$(dpkg-query -W -f='${Version}' git)" = "1:2.43.0-1ubuntu7.4"
          test "$(dpkg-query -W -f='${Version}' git-man)" = "1:2.43.0-1ubuntu7.4"
          test "$(/usr/bin/git --version)" = "git version 2.43.0"
          printf '%s  %s\n' 'eb54b535467e0975c1284d4c4d08eea779aeb248a5d34b02e2ee171382e22201' '/usr/bin/git' | sha256sum --check --strict

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          standalone: true

      # `package.json` fija `packageManager`, así que la versión de pnpm sale
      # de ahí y no se declara dos veces. Ese mismo campo hace que setup-node
      # active su caché de pnpm por defecto; acá no hay nada que guardar (las
      # dependencias se instalan desde un store aislado y efímero) y el post-job
      # fallaba con "Path Validation Error" (corrida 55), así que se apaga.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Materializar runtimes auditados con ownership del runner
        shell: bash
        run: |
          set -euo pipefail
          agorbis_node_source="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          agorbis_node_root="$(mktemp -d "${RUNNER_TEMP:?}/agorbis-node.XXXXXX")"
          cp -R --no-preserve=ownership "$agorbis_node_source/." "$agorbis_node_root/"
          chmod 0755 "$agorbis_node_root/bin" "$agorbis_node_root/bin/node"
          printf '%s  %s\n' '1bec56ef7cfa9a76f3e0b7c0a87f220eb73f23102b9c0b4c7529a3f7c3ce7c31' "$agorbis_node_root/bin/node" | sha256sum --check --strict
          printf '%s\n' "$agorbis_node_root/bin" >> "$GITHUB_PATH"
          export PATH="$agorbis_node_root/bin:$PATH"

          # El instalador oficial crea las 17 entradas que exige el gate D72.
          # Su store global es distinto del store frío de las dependencias.
          umask 0002
          agorbis_pnpm_install="$(mktemp -d "${RUNNER_TEMP:?}/agorbis-pnpm-runtime.XXXXXX")"
          (
            cd "$agorbis_pnpm_install"
            PNPM_HOME="$agorbis_pnpm_install" PATH="$agorbis_pnpm_install:$PATH" pnpm self-update 11.15.0
          )
          agorbis_pnpm_packages=("$agorbis_pnpm_install"/store/v11/links/@pnpm/exe/11.15.0/*/node_modules/@pnpm/exe)
          test "${#agorbis_pnpm_packages[@]}" = 1
          test -d "${agorbis_pnpm_packages[0]}"
          agorbis_pnpm_canonical="$HOME/.local/share/pnpm/store/v11/links/@pnpm/exe/11.15.0/ff1311a9abb7c52b221f2ed434f6566da0b6def25cabdb13185748edbacb07cb/node_modules/@pnpm/exe"
          test ! -e "$agorbis_pnpm_canonical"
          test ! -L "$agorbis_pnpm_canonical"
          mkdir -p "$(dirname "$agorbis_pnpm_canonical")"
          cp -a "${agorbis_pnpm_packages[0]}" "$agorbis_pnpm_canonical"
          test "$(stat -c '%a' "$agorbis_pnpm_canonical")" = "775"
          printf '%s  %s\n' '5253220be9149295a49460c5e88fbfac2f78194be0a0050c7b4a65eca788a68b' "$agorbis_pnpm_canonical/pnpm" | sha256sum --check --strict
          test "$("$agorbis_pnpm_canonical/pnpm" --version)" = "11.15.0"
          printf '%s\n' "$agorbis_pnpm_canonical" >> "$GITHUB_PATH"

      - name: Instalar dependencias desde un store aislado
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          test "$(node --version)" = "v22.22.0"
          test "$(pnpm --version)" = "11.15.0"
          test "$(pnpm config get sideEffectsCache)" = "false"
          agorbis_pnpm_scratch="$(mktemp -d "${RUNNER_TEMP:?}/agorbis-pnpm.XXXXXX")"
          agorbis_pnpm_store="${agorbis_pnpm_scratch}/store"
          test ! -e node_modules
          test ! -L node_modules
          test ! -e "$agorbis_pnpm_store"
          test ! -L "$agorbis_pnpm_store"
          pnpm install --frozen-lockfile --store-dir "$agorbis_pnpm_store"
          agorbis_effective_store="$(realpath "$(pnpm store path --store-dir "$agorbis_pnpm_store")")"
          agorbis_pnpm_store="$(realpath "$agorbis_pnpm_store")"
          case "$agorbis_effective_store" in
            "$agorbis_pnpm_store"|"$agorbis_pnpm_store"/*) ;;
            *) echo "El store efectivo de pnpm escapó del scratch aislado." >&2; exit 1 ;;
          esac
          node <<'JS'
          import("./scripts/d72-non-stateful-composite-collector.mjs").then(({ assertD72CompositeProductionRuntime }) => {
            assertD72CompositeProductionRuntime();
          });
          JS

      - run: pnpm test.release

  auditoria-semanal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No es un check requerido y en `schedule` no bloquea ningún PR: el
    # bloqueo de advisories está en `verificar` con `--audit-level=high`. Pero
    # una excepción vencida tiene que dejar la corrida en rojo, porque GitHub
    # sólo avisa de las programadas cuando fallan. Por eso no hay
    # `continue-on-error` a nivel de job (marcaba éxito aunque fallara un paso
    # y nadie se enteraba del vencimiento): sólo el audit `low` es informativo.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          standalone: true

      # `package.json` fija `packageManager`, así que la versión de pnpm sale
      # de ahí y no se declara dos veces. Ese mismo campo hace que setup-node
      # active su caché de pnpm por defecto; acá no hay nada que guardar (las
      # dependencias se instalan desde un store aislado y efímero) y el post-job
      # fallaba con "Path Validation Error" (corrida 55), así que se apaga.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          package-manager-cache: false

      # Sólo usa node:fs; falla si una excepción de `pnpm-workspace.yaml`
      # pasó su fecha "revisar antes de".
      - name: Excepciones de audit vencidas
        run: node scripts/check-audit-ignores.mjs --fail-on-expired

      # `pnpm audit` lee el lockfile: no hace falta instalar dependencias.
      # `if: always()` para que corra aunque haya excepciones vencidas, y
      # `continue-on-error` para que moderate/low se vean sin poner la corrida
      # en rojo todas las semanas.
      - name: Audit completo
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level=low
